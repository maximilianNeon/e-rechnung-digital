name: IndexNow

on:
  status:

jobs:
  ping:
    # Vercel reports deploys as the commit status "Vercel"; only ping once main is live.
    if: github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
